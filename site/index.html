<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.Alidealer.com — Only the best AliExpress deals</title>
    <meta name="description" content="www.Alidealer.com: only the best AliExpress deals, hand-picked, checked and sorted by category.">
    <meta name="theme-color" content="#f56c1c">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="www.Alidealer.com">
    <meta property="og:title" content="www.Alidealer.com — Only the best deals">
    <meta property="og:description" content="Hand-picked AliExpress deals, checked and sorted by category.">
    <meta property="og:image" content="https://alidealer.com/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Instrument+Sans:wght@400;600&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=13">
</head>
<body>
    <header class="hero">
        <div class="wrap hero-inner">
            <a class="logo" href="/" aria-label="www.Alidealer.com home">
                <img class="logo-cart" src="/cart.png" alt="" width="209" height="160">
                <span class="logo-text">
                    <span class="brand" id="brand" dir="ltr"><small>www.</small>Alidealer<small>.com</small></span>
                    <span class="slogan" data-i18n="slogan">Only the best deals</span>
                </span>
            </a>
            <div class="masthead-meta">
                <button class="lang" id="lang" type="button" lang="he">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                    <span id="lang-label">עברית</span>
                </button>
                <strong id="count">—</strong><span data-i18n="findsListed">finds listed</span>
            </div>
        </div>
    </header>

    <div class="wrap">
        <div class="tagline">
            <span id="tagline"></span>
            <span id="updated"></span>
        </div>

        <nav class="toolbar">
            <div class="chips" id="chips" role="toolbar" aria-label="Categories" data-i18n-aria="categories"></div>
            <label class="search">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="q" type="search" placeholder="Search finds" aria-label="Search finds" data-i18n-placeholder="search" data-i18n-aria="search">
            </label>
            <button class="surprise" id="surprise" type="button" disabled>
                <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="3"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="8" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="8" cy="16" r="1.2" fill="currentColor"/><circle cx="16" cy="16" r="1.2" fill="currentColor"/></svg>
                <span data-i18n="surprise">Surprise me</span>
            </button>
        </nav>

        <main class="grid" id="grid"></main>

        <footer>
            <span data-i18n="disclosure">Affiliate disclosure: links on this site are AliExpress affiliate links. If you buy through them we may earn a small commission, at no extra cost to you.</span>
            <span id="copy"></span>
        </footer>
    </div>

    <dialog class="lucky" id="lucky" aria-labelledby="lucky-title">
        <button class="lucky-close" id="lucky-close" type="button" aria-label="Close" data-i18n-aria="close">&times;</button>
        <div class="lucky-label" id="lucky-label">Random find</div>
        <div class="lucky-img" id="lucky-img"></div>
        <div class="card-cat" id="lucky-cat"></div>
        <h3 class="card-title" id="lucky-title"></h3>
        <div class="price" id="lucky-price"></div>
        <div class="lucky-actions">
            <button class="btn ghost" id="lucky-again" type="button" data-i18n="spinAgain">Spin again</button>
            <a class="btn accent" id="lucky-go" target="_blank" rel="sponsored nofollow noopener" data-i18n="seeOn">See on AliExpress</a>
        </div>
    </dialog>

    <script src="/config.js?v=13"></script>
    <script src="/store.js?v=13"></script>
</body>
</html>
