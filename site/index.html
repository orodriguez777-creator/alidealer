<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Haul — Hand-picked AliExpress finds</title>
    <meta name="description" content="Hand-picked AliExpress finds, checked and sorted by category.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="wrap">
        <header class="masthead">
            <h1 class="brand" id="brand">The <em>Haul</em></h1>
            <div class="masthead-meta"><strong id="count">—</strong>finds listed</div>
        </header>
        <div class="tagline">
            <span id="tagline"></span>
            <span id="updated"></span>
        </div>

        <nav class="toolbar">
            <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
            <label class="search">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="q" type="search" placeholder="Search finds" aria-label="Search finds">
            </label>
        </nav>

        <main class="grid" id="grid"></main>

        <footer>
            <span>Affiliate disclosure: links on this site are AliExpress affiliate links. If you buy through them we may earn a small commission, at no extra cost to you.</span>
            <span id="copy"></span>
        </footer>
    </div>

    <script src="/config.js"></script>
    <script src="/store.js"></script>
</body>
</html>
